[package]
edition      = "2024"
name         = "PINGCapstone"
rust-version = "1.88"
version      = "0.1.0"

# Cargo target names become rustc crate names, which must be snake_case;
# the package (and repo) keeps its PINGCapstone identity.
[lib]
name = "ping_capstone"
path = "./src/lib.rs"

[[bin]]
name = "ping_capstone"
path = "./src/bin/main.rs"

# Flashes the NEO-M9N driver on its own, without the rest of the application.
[[bin]]
name = "gps_demo"
path = "./src/bin/gps_demo.rs"

# Flashes the BNO085 driver on its own, without the rest of the application.
[[bin]]
name = "imu_demo"
path = "./src/bin/imu_demo.rs"

# Flashes the TF03 LiDAR driver on its own, without the rest of the application.
[[bin]]
name = "lidar_demo"
path = "./src/bin/lidar_demo.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-hal-async = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
rtt-target = "0.6.2"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32s3",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
# UBX framing and message decoding for the NEO-M9N. Protocol 31 is the
# closest the crate offers to the M9N's 32.01, and carries the same NAV-PVT,
# MON-VER and CFG-VALSET layouts.
ublox = { version = "0.10.0", default-features = false, features = [
  "ubx_proto31",
] }
# Trigonometry for turning a LiDAR range and IMU orientation into a
# coordinate. `core` has no sin, cos or atan2 on stable Rust.
libm = "0.2.16"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
